services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["app"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    # Do not publish 5432 to the internet on a VPS.
    # Uncomment for local debugging only:
    # ports:
    #   - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-booking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-booking}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    # Management UI (15672) — prefer SSH tunnel on VPS, do not expose publicly.
    # Uncomment for local debugging only:
    # ports:
    #   - "15672:15672"
    #   - "5672:5672"

volumes:
  db_data:
