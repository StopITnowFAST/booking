framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            failed: '%env(MESSENGER_TRANSPORT_FAILED_DSN)%'
            sync: 'sync://'

        routing:
            # Route domain messages to async when they appear, e.g.:
            # 'App\Message\BookingCreated': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
